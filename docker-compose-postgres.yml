services:
  reverse-proxy:
    build:
      context: ./reverse-proxy
    ports:
      - 80:80
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
        - 8000:8000
    env_file:
        - .env
    volumes:
        - ./backend/api:/app/api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: nextjs-dev
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - ./frontend/src:/app/src

    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    restart: unless-stopped

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
        - 8080:8080
  
  localdb:
    image: postgres:14.5
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 5432:5432
    restart: unless-stopped