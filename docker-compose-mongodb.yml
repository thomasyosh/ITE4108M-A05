services:
  reverse-proxy:
    build:
      context: ./reverse-proxy
    ports:
      - 80:80
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
        - 8000:8000
    env_file:
        - .env
    volumes:
        - ./backend/api:/app/api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: nextjs-dev
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - ./frontend/src:/app/src
    # environment:
    #   NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    restart: unless-stopped

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
        - 8080:8080
  
  localdb:
    image: mongo:3.1
    volumes:
      - ./mongo_data:/var/lib/mongodb/data
    environment:
        MONGO_HOST=$MONGO_HOST
      - MONGO_USER=$MONGO_USER
      - MONGO_PASSWORD=$MONGO_PASSWORD
      - MONGO_DB=$MONGO_DB
    ports:
      - 8081:8081
    restart: unless-stopped